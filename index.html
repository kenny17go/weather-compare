<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#438edb"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.svg"><title>Weather Compare</title>
<style>
:root{--glass:rgba(255,255,255,.14);--line:rgba(255,255,255,.2);--muted:rgba(255,255,255,.72)}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Noto Sans TC",sans-serif;color:#fff;background:#2e6fb8}body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 80% 10%,rgba(255,255,255,.22),transparent 28%),linear-gradient(180deg,#438edb,#3375bd 42%,#1e4d84);z-index:-2}.app{max-width:520px;margin:auto;min-height:100dvh;padding:env(safe-area-inset-top) 16px calc(88px + env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;align-items:center;padding:12px 2px}.loc{font-weight:650}.round{width:38px;height:38px;border:0;border-radius:50%;color:#fff;background:var(--glass);font-size:18px}.hero{text-align:center;padding:22px 0 20px}.hero h1{font-size:74px;line-height:.95;margin:8px 0;font-weight:250;letter-spacing:-4px}.hero .condition{font-size:20px}.hero .range,.note,small{color:var(--muted)}.card{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:22px;margin:12px 0;padding:15px}.label{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:700}.hourly{display:flex;gap:18px;overflow:auto;padding:12px 0 2px}.hour{text-align:center;min-width:48px}.hour b{display:block;margin-top:8px}.hour .ico{font-size:24px;margin:9px 0}.day{display:grid;grid-template-columns:1fr 42px 42px 1.4fr;align-items:center;padding:10px 0;border-top:1px solid var(--line)}.bar{height:5px;border-radius:8px;background:linear-gradient(90deg,#79c9ff,#ffd76d)}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{min-height:118px}.metric strong{font-size:29px;font-weight:450;display:block;margin-top:9px}.metric p{margin:7px 0 0;color:var(--muted);font-size:13px}.tabs{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(calc(100% - 28px),492px);display:grid;grid-template-columns:1fr 1fr;padding:6px;background:rgba(16,42,76,.68);border:1px solid var(--line);backdrop-filter:blur(24px);border-radius:22px}.tab{border:0;background:transparent;color:var(--muted);border-radius:17px;padding:11px;font-size:14px;font-weight:650}.tab.active{background:rgba(255,255,255,.16);color:#fff}.page{display:none}.page.active{display:block}.compare-head{padding:18px 2px 6px}.compare-head h1{font-size:34px;margin:0 0 4px}.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;background:rgba(15,44,80,.36);padding:5px;border-radius:15px;margin:14px 0}.seg button{border:0;border-radius:11px;padding:10px;background:transparent;color:var(--muted);font-weight:650}.seg button.active{background:rgba(255,255,255,.18);color:#fff}.consensus{text-align:center;padding:20px}.consensus .big{font-size:28px;font-weight:650;margin:8px}.source{display:grid;grid-template-columns:1fr auto;gap:12px;padding:14px 0;border-top:1px solid var(--line)}.source h3{margin:0 0 4px;font-size:16px}.vals{text-align:right}.vals strong{font-size:19px}.vals div{color:var(--muted);font-size:13px;margin-top:3px}.note{font-size:12px;line-height:1.5;padding:2px 4px 16px}
</style></head><body><main class="app">
<section id="now" class="page active"><div class="top"><div class="loc" id="locationName">⌖ 取得位置中…</div><button class="round" id="locateBtn" aria-label="重新定位">⌖</button></div><div class="hero"><div>現在</div><h1 id="currentTemp">--°</h1><div class="condition" id="currentCondition">載入天氣中…</div><div class="range" id="todayRange">最高 --°　最低 --°</div></div><div class="card"><div class="label">未來 24 小時</div><div class="hourly" id="hours"></div></div><div class="card"><div class="label">7 日預報</div><div id="days"></div></div><div class="note" style="text-align:center;padding-top:4px">預報：中央氣象署｜即時與逐時：Open-Meteo</div><div class="metrics"><div class="card metric"><div class="label">體感溫度</div><strong id="feels">--°</strong><p>目前體感溫度</p></div><div class="card metric"><div class="label">降雨機率</div><strong id="rainChance">--%</strong><p>目前小時預報</p></div><div class="card metric"><div class="label">濕度</div><strong id="humidity">--%</strong><p>目前相對濕度</p></div><div class="card metric"><div class="label">風速</div><strong id="wind">--</strong><p>km/h・目前風速</p></div></div></section>
<section id="compare" class="page"><div class="compare-head"><div class="loc" id="compareLocation">⌖ 目前位置</div><h1>預報比較</h1><div class="note">同一地點、同一日期，一眼比較不同來源</div></div><div class="seg"><button class="active" data-day="明天">明天</button><button data-day="3 天後">3 天後</button><button data-day="7 天後">7 天後</button></div><div class="card consensus"><div class="label" id="when">明天・預報共識</div><div class="big" id="consensusTitle">載入模型預報中…</div><p id="tempConsensus">最高溫預測範圍 --</p><p id="rainConsensus">預估降雨量範圍 --</p></div><div class="card"><div class="label">各來源</div><div id="sources"></div></div><div class="note">v0.7.6・修正未來 24 小時降雨機率欄位索引。</div></section>
</main><nav class="tabs"><button class="tab active" data-page="now">☀️　現在</button><button class="tab" data-page="compare">⚖️　比較</button></nav>
<script>
const wx=(code,day=1)=>{if(code===0)return[day?"☀️":"🌙","晴朗"];if(code<=2)return[day?"🌤️":"☁️","晴時多雲"];if(code===3)return["☁️","陰天"];if(code<=48)return["🌫️","霧"];if(code<=57)return["🌦️","毛毛雨"];if(code<=67)return["🌧️","雨"];if(code<=77)return["🌨️","雪"];if(code<=82)return["🌦️","陣雨"];if(code<=86)return["🌨️","陣雪"];return["⛈️","雷雨"]};
const wd=["週日","週一","週二","週三","週四","週五","週六"];
let currentCoords=null,currentDistrict="";
async function resolveDistrict(lat,lon){try{const r=await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=zh`);if(!r.ok)throw Error("geo");const j=await r.json(),a=j.localityInfo?.administrative||[];const names=a.map(x=>String(x.name||"").replaceAll("台","臺"));return names.find(n=>/[區鄉鎮市]$/.test(n)&&!/[縣市]$/.test(n))||String(j.locality||"").replaceAll("台","臺")||""}catch(e){return ""}}
async function loadWeather(lat,lon){currentCoords={lat,lon};currentDistrict=await resolveDistrict(lat,lon);if(currentDistrict){document.querySelector("#locationName").textContent="⌖ "+currentDistrict;document.querySelector("#compareLocation").textContent="⌖ "+currentDistrict;}
 const q=new URLSearchParams({latitude:lat,longitude:lon,timezone:"auto",forecast_days:"7",current:"temperature_2m,relative_humidity_2m,apparent_temperature,is_day,weather_code,wind_speed_10m",hourly:"temperature_2m,precipitation_probability,weather_code,is_day",daily:"weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset"});
 const r=await fetch("https://api.open-meteo.com/v1/forecast?"+q);if(!r.ok)throw Error("weather");const d=await r.json();
 const cur=d.current, wi=wx(cur.weather_code,cur.is_day);
 document.querySelector("#currentTemp").textContent=Math.round(cur.temperature_2m)+"°";document.querySelector("#currentCondition").textContent=wi[0]+" "+wi[1];
 document.querySelector("#todayRange").textContent="最高 "+Math.round(d.daily.temperature_2m_max[0])+"°　最低 "+Math.round(d.daily.temperature_2m_min[0])+"°";
 document.querySelector("#feels").textContent=Math.round(cur.apparent_temperature)+"°";document.querySelector("#humidity").textContent=Math.round(cur.relative_humidity_2m)+"%";document.querySelector("#wind").textContent=Math.round(cur.wind_speed_10m);
 let hi=d.hourly.time.findIndex(t=>t>=cur.time);if(hi<0)hi=0;document.querySelector("#rainChance").textContent=(d.hourly.precipitation_probability[hi]??0)+"%";
 const hs=[];for(let i=hi;i<Math.min(hi+24,d.hourly.time.length);i++){const t=new Date(d.hourly.time[i]);hs.push([i===hi?"現在":String(t.getHours()).padStart(2,"0")+"時",wx(d.hourly.weather_code[i],d.hourly.is_day[i])[0],Math.round(d.hourly.temperature_2m[i])+"°",d.hourly.precipitation_probability[i]??0])}
 document.querySelector("#hours").innerHTML=hs.map(x=>`<div class="hour"><span>${x[0]}</span><div class="ico">${x[1]}</div><small>💧${Number.isFinite(Number(x[3]))?x[3]:0}%</small><b>${x[2]}</b></div>`).join("");
 document.querySelector("#days").innerHTML=d.daily.time.map((s,i)=>{const dt=new Date(s+"T12:00:00"),name=i===0?"今天":wd[dt.getDay()],ic=wx(d.daily.weather_code[i],1)[0];return `<div class="day"><b>${name}</b><span>${ic}</span><span>${Math.round(d.daily.temperature_2m_min[i])}°</span><div><span class="bar" style="display:inline-block;width:60%;margin-right:8px"></span>${Math.round(d.daily.temperature_2m_max[i])}°</div></div>`}).join("");
 try{const cd=await fetchCWA();if(cd.locationName){document.querySelector("#locationName").textContent="⌖ "+cd.locationName;document.querySelector("#compareLocation").textContent="⌖ "+cd.locationName;}const cx=parseCWAForDay(cd,0);if(cx){if(cx.hi!=null&&cx.lo!=null)document.querySelector("#todayRange").textContent="最高 "+cx.hi+"°　最低 "+cx.lo+"°";if(cx.weather)document.querySelector("#currentCondition").textContent="🇹🇼 "+cx.weather+"　"+Math.round(cur.temperature_2m)+"°";}}catch(e){}
}
function locate(){document.querySelector("#locationName").textContent="⌖ 取得位置中…";if(!navigator.geolocation){fallback();return}navigator.geolocation.getCurrentPosition(p=>{document.querySelector("#locationName").textContent="⌖ 目前位置";document.querySelector("#compareLocation").textContent="⌖ 目前位置";loadWeather(p.coords.latitude,p.coords.longitude).catch(fallback)},fallback,{enableHighAccuracy:true,timeout:10000,maximumAge:300000})}
function fallback(){document.querySelector("#locationName").textContent="⌖ 台北";document.querySelector("#compareLocation").textContent="⌖ 台北";loadWeather(25.05,121.52).catch(()=>document.querySelector("#currentCondition").textContent="天氣資料暫時無法載入")}
document.querySelector("#locateBtn").onclick=locate;locate();
let horizon=1;
const providerDefs=[
 {name:"🇹🇼 中央氣象署",endpoint:"cwa",note:"官方鄉鎮預報"},
 {name:"🇩🇪 ICON",endpoint:"dwd-icon",note:"DWD ICON"},
 {name:"🌍 ECMWF",endpoint:"ecmwf",note:"ECMWF IFS"},
 {name:"🇺🇸 GFS",endpoint:"gfs",note:"NOAA GFS"},
 {name:"🇯🇵 JMA",endpoint:"jma",note:"JMA"}
];
async function fetchCWA(){
 if(!currentCoords)throw Error("no-location");
 if(!currentDistrict)currentDistrict=await resolveDistrict(currentCoords.lat,currentCoords.lon);
 if(!currentDistrict)throw Error("district-not-found");
 const p=new URLSearchParams({locationName:currentDistrict});
 const r=await fetch("https://aqldnpnemmlljxwxpmfr.supabase.co/functions/v1/weather-api?"+p);
 if(!r.ok)throw Error("cwa");return r.json();
}
function parseCWAForDay(d,dayOffset){
 const old=horizon; horizon=dayOffset==null?1:dayOffset; const x=parseCWA(d); horizon=old; return x;
}
function parseCWA(d){
 const n=d.normalized||{}, keys=Object.keys(n), pick=(...names)=>{for(const x of names)if(n[x])return n[x];for(const k of keys)if(names.some(x=>k.includes(x)))return n[k];return []};
 const wx=pick("天氣現象","Wx"),pop=pick("12小時降雨機率","降雨機率","PoP12h","PoP"),temp=pick("溫度","T"),max=pick("最高溫度","最高溫","MaxT"),min=pick("最低溫度","最低溫","MinT"),wind=pick("風速","WS");
 const idx=horizon===0?0:Math.min(horizon*2-1,Math.max(0,wx.length-1)),wt=wx[idx]||wx[0];if(!wt)return null;
 const day=String(wt.start||"").slice(0,10), nums=(arr)=>arr.filter(x=>String(x.start||"").startsWith(day)).map(x=>parseFloat(String(x.value))).filter(Number.isFinite);
 let hi=nums(max),lo=nums(min);const ts=nums(temp);if(!hi.length&&ts.length)hi=[Math.max(...ts)];if(!lo.length&&ts.length)lo=[Math.min(...ts)];
 const po=nums(pop),wi=nums(wind);return {date:day,weather:wt.value||"中央氣象署預報",hi:hi.length?Math.max(...hi):null,lo:lo.length?Math.min(...lo):null,pop:po.length?Math.max(...po):null,wind:wi.length?Math.max(...wi):null};
}
async function fetchModel(endpoint,lat,lon){
 const p=new URLSearchParams({latitude:lat,longitude:lon,timezone:"auto",forecast_days:"8",daily:"weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,wind_speed_10m_max"});
 const r=await fetch("https://api.open-meteo.com/v1/"+endpoint+"?"+p);if(!r.ok)throw Error(endpoint);return r.json();
}
async function renderCompare(){
 const box=document.querySelector("#sources");if(!currentCoords){box.innerHTML='<div class="source">等待定位…</div>';return}
 box.innerHTML='<div class="source">正在取得三個模型資料…</div>';
 const live=await Promise.all(providerDefs.map(async p=>{if(!p.endpoint)return p;try{if(p.endpoint==="cwa"){const d=await fetchCWA(),x=parseCWA(d);if(!x)throw Error("cwa-data");return {...p,cwa:true,data:x}}const d=await fetchModel(p.endpoint,currentCoords.lat,currentCoords.lon),i=Math.min(horizon,d.daily.time.length-1);return {...p,data:{code:d.daily.weather_code[i],hi:d.daily.temperature_2m_max[i],lo:d.daily.temperature_2m_min[i],rain:d.daily.precipitation_sum[i],wind:d.daily.wind_speed_10m_max[i],date:d.daily.time[i]}}}catch(e){return {...p,error:true}}}));
 box.innerHTML=live.map(p=>{if(!p.endpoint)return `<div class="source"><div><h3>${p.name}</h3><small>${p.note}</small></div><div class="vals"><strong>${p.status}</strong></div></div>`;if(p.error)return `<div class="source"><div><h3>${p.name}</h3><small>${p.note}</small></div><div class="vals"><strong>載入失敗</strong></div></div>`;const x=p.data;if(p.cwa){const temps=(x.hi!=null&&x.lo!=null)?`${x.hi}° / ${x.lo}°`:"溫度資料待補";const rain=x.pop!=null?`降雨機率 ${x.pop}%`:"降雨機率資料待補";return `<div class="source"><div><h3>${p.name}</h3><small>${p.note}・${x.date}</small></div><div class="vals"><strong>${x.weather}　${temps}</strong><div>${rain}・風速 ${x.wind??"--"} m/s</div></div></div>`}const w=wx(x.code,1);return `<div class="source"><div><h3>${p.name}</h3><small>${p.note}・${x.date}</small></div><div class="vals"><strong>${w[0]} ${Math.round(x.hi)}° / ${Math.round(x.lo)}°</strong><div>雨量 ${Number(x.rain).toFixed(1)} mm・最大風速 ${Math.round(x.wind)} km/h</div></div></div>`}).join("");
 const ok=live.filter(p=>p.data&&!p.cwa).map(p=>p.data);if(ok.length){const his=ok.map(x=>x.hi),rs=ok.map(x=>x.rain),wet=ok.filter(x=>x.rain>=1).length;document.querySelector("#consensusTitle").textContent=wet>=2?"🌦️ 多數模型預測有雨":"🌤️ 多數模型偏乾";document.querySelector("#tempConsensus").textContent="最高溫預測範圍 "+Math.round(Math.min(...his))+"–"+Math.round(Math.max(...his))+"°C";document.querySelector("#rainConsensus").textContent="預估雨量範圍 "+Math.min(...rs).toFixed(1)+"–"+Math.max(...rs).toFixed(1)+" mm"}
}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab,.page").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.querySelector("#"+b.dataset.page).classList.add("active");if(b.dataset.page==="compare")renderCompare()});document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".seg button").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.querySelector("#when").textContent=b.dataset.day+"・預報共識";horizon=b.dataset.day==="明天"?1:b.dataset.day==="3 天後"?3:7;renderCompare()});if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js");
</script></body></html>
