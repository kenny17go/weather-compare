<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#438edb"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" sizes="512x512" href="icon-512.png"><title>Weather Compare</title>
<style>
:root{--glass:rgba(255,255,255,.14);--line:rgba(255,255,255,.2);--muted:rgba(255,255,255,.72)}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Noto Sans TC",sans-serif;color:#fff;background:#2e6fb8;transition:background .8s ease}body:before{content:"";position:fixed;inset:0;z-index:-3;background:var(--weather-bg,radial-gradient(circle at 80% 10%,rgba(255,255,255,.22),transparent 28%),linear-gradient(180deg,#438edb,#3375bd 42%,#1e4d84));transition:background 1s ease}.skyfx{position:fixed;inset:0;z-index:-2;pointer-events:none;overflow:hidden}.skyfx:before,.skyfx:after{content:"";position:absolute;inset:0;opacity:0;transition:opacity .8s}.skyfx:after{inset:auto 5% 0 auto;width:120px;height:340px;background:linear-gradient(90deg,transparent 43%,rgba(3,12,24,.78) 44% 56%,transparent 57%),linear-gradient(90deg,transparent 32%,rgba(3,12,24,.72) 33% 67%,transparent 68%);clip-path:polygon(48% 0,52% 0,54% 8%,59% 8%,57% 14%,63% 14%,61% 21%,67% 21%,64% 29%,71% 29%,68% 38%,75% 38%,72% 48%,80% 48%,76% 60%,85% 60%,81% 73%,91% 73%,91% 100%,9% 100%,9% 73%,19% 73%,15% 60%,24% 60%,20% 48%,28% 48%,25% 38%,32% 38%,29% 29%,36% 29%,33% 21%,39% 21%,37% 14%,43% 14%,41% 8%,46% 8%);filter:drop-shadow(0 0 14px rgba(255,210,110,.18));transform:translateZ(0)}body.taipei .skyfx:after{opacity:.92}
body.taipei:before{background-size:cover;background-repeat:no-repeat;background-position:58% top;background-color:#071426;background-attachment:scroll}
body.taipei.wx-night:before{background-image:linear-gradient(180deg,rgba(3,15,32,.10),rgba(4,18,34,.35)),url("assets/taipei-night.webp.PNG")}
body.taipei.wx-day:before{background-image:linear-gradient(180deg,rgba(32,116,184,.06),rgba(18,69,112,.20)),url("assets/taipei-day.webp.PNG")}
body.taipei.wx-rain:before{filter:saturate(.72) brightness(.72)}
body.taipei.wx-storm:before{filter:saturate(.55) brightness(.58)}
body.taipei .skyfx:after{display:none}
body.wx-rain .skyfx:before{opacity:.55;background:repeating-linear-gradient(105deg,transparent 0 17px,rgba(210,235,255,.28) 18px 19px,transparent 20px 35px);animation:rainfall .7s linear infinite}body.wx-night .skyfx:before{opacity:.8;background:radial-gradient(circle at 76% 13%,rgba(255,250,218,.9) 0 2.5%,rgba(255,250,218,.16) 2.7% 5%,transparent 5.2%),radial-gradient(circle,rgba(255,255,255,.8) 0 1px,transparent 1.4px);background-size:auto,55px 55px}body.wx-storm .skyfx:before{opacity:.7;background:linear-gradient(180deg,rgba(7,15,31,.2),rgba(4,11,23,.6))}@keyframes rainfall{to{background-position:-20px 45px}}.app{max-width:520px;margin:auto;min-height:100dvh;padding:env(safe-area-inset-top) 16px calc(88px + env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;align-items:center;padding:12px 2px}.loc{font-weight:650;cursor:pointer}.place-sheet{position:fixed;inset:0;z-index:20;background:rgba(7,24,45,.38);display:none;align-items:flex-end;justify-content:center}.place-sheet.open{display:flex}.place-panel{width:min(100%,520px);background:rgba(31,78,132,.96);backdrop-filter:blur(28px);border:1px solid var(--line);border-radius:28px 28px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -12px 40px rgba(0,0,0,.2)}.place-panel h2{margin:2px 0 14px}.place-search{display:flex;gap:8px}.place-search input{flex:1;border:0;border-radius:14px;padding:12px 14px;font-size:16px;background:rgba(255,255,255,.14);color:#fff;outline:none}.place-search input::placeholder{color:var(--muted)}.place-search button,.place-item{border:0;color:#fff;background:rgba(255,255,255,.12);border-radius:14px;padding:12px;font-weight:650}.place-list{display:grid;gap:8px;margin-top:12px}.place-row{display:grid;grid-template-columns:1fr 44px;gap:8px}.place-item{text-align:left}.place-del{border:0;border-radius:14px;background:rgba(255,255,255,.12);color:#fff;font-size:20px}.place-item small{display:block;margin-top:3px}.place-close{float:right;border:0;background:transparent;color:#fff;font-size:22px}.round{width:38px;height:38px;border:0;border-radius:50%;color:#fff;background:var(--glass);font-size:18px}.hero{text-align:center;padding:22px 0 20px}.hero h1{font-size:74px;line-height:.95;margin:8px 0;font-weight:250;letter-spacing:-4px}.hero .condition{font-size:20px}.hero .range,.note,small{color:var(--muted)}.card{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:22px;margin:12px 0;padding:15px}.label{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:700}.hourly{display:flex;gap:18px;overflow:auto;padding:12px 0 2px}.hour{text-align:center;min-width:48px}.hour b{display:block;margin-top:8px}.hour .ico{font-size:24px;margin:9px 0}.day{display:grid;grid-template-columns:1fr 42px 42px 1.4fr;align-items:center;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}.cwa-detail{grid-column:1/-1;display:none;gap:8px;overflow-x:auto;padding:10px 0 2px}.day.open .cwa-detail{display:flex}.cwa-slot{min-width:72px;text-align:center;padding:8px 6px;border-radius:12px;background:rgba(255,255,255,.08);font-size:12px}.cwa-slot i{display:block;font-style:normal;font-size:22px;margin:5px 0}.cwa-slot b{font-size:15px}.cwa-hint{grid-column:1/-1;color:var(--muted);font-size:11px;margin-top:3px}.bar{height:5px;border-radius:8px;background:linear-gradient(90deg,#79c9ff,#ffd76d)}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{min-height:118px}.metric strong{font-size:29px;font-weight:450;display:block;margin-top:9px}.metric p{margin:7px 0 0;color:var(--muted);font-size:13px}.tabs{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(calc(100% - 28px),492px);display:grid;grid-template-columns:1fr 1fr;padding:6px;background:rgba(16,42,76,.68);border:1px solid var(--line);backdrop-filter:blur(24px);border-radius:22px}.tab{border:0;background:transparent;color:var(--muted);border-radius:17px;padding:11px;font-size:14px;font-weight:650}.tab.active{background:rgba(255,255,255,.16);color:#fff}.page{display:none}.page.active{display:block}.compare-head{padding:18px 2px 6px}.compare-head h1{font-size:34px;margin:0 0 4px}.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;background:rgba(15,44,80,.36);padding:5px;border-radius:15px;margin:14px 0}.seg button{border:0;border-radius:11px;padding:10px;background:transparent;color:var(--muted);font-weight:650}.seg button.active{background:rgba(255,255,255,.18);color:#fff}.consensus{text-align:center;padding:20px}.consensus .big{font-size:28px;font-weight:650;margin:8px}.source{display:grid;grid-template-columns:1fr auto;gap:12px;padding:14px 0;border-top:1px solid var(--line)}.source h3{margin:0 0 4px;font-size:16px}.vals{text-align:right}.vals strong{font-size:19px}.vals div{color:var(--muted);font-size:13px;margin-top:3px}.note{font-size:12px;line-height:1.5;padding:2px 4px 16px}
</style></head><body><div class="skyfx" aria-hidden="true"></div><main class="app">
<div class="place-sheet" id="placeSheet"><div class="place-panel"><button class="place-close" id="placeClose">×</button><h2>我的地點</h2><div class="place-search"><input id="placeInput" placeholder="搜尋地區，例如：信義區、淡水"><button id="placeAdd">搜尋</button></div><div class="place-list" id="placeList"></div></div></div><section id="now" class="page active"><div class="top"><div class="loc" id="locationName">⌖ 取得位置中…</div><button class="round" id="locateBtn" aria-label="重新定位">⌖</button></div><div class="hero"><div>現在</div><h1 id="currentTemp">--°</h1><div class="condition" id="currentCondition">載入天氣中…</div><div class="range" id="todayRange">最高 --°　最低 --°</div></div><div class="card"><div class="label">未來 24 小時</div><div class="hourly" id="hours"></div></div><div class="card"><div class="label">7 日預報</div><div id="days"></div></div><div class="note" style="text-align:center;padding-top:4px">預報：中央氣象署｜即時與逐時：Open-Meteo</div><div class="metrics"><div class="card metric"><div class="label">體感溫度</div><strong id="feels">--°</strong><p>目前體感溫度</p></div><div class="card metric"><div class="label">降雨機率</div><strong id="rainChance">--%</strong><p>目前小時預報</p></div><div class="card metric"><div class="label">濕度</div><strong id="humidity">--%</strong><p>目前相對濕度</p></div><div class="card metric"><div class="label">風速</div><strong id="wind">--</strong><p>km/h・目前風速</p></div></div></section>
<section id="compare" class="page"><div class="compare-head"><div class="loc" id="compareLocation">⌖ 目前位置</div><h1>預報比較</h1><div class="note">同一地點、同一日期，一眼比較不同來源</div></div><div class="seg"><button class="active" data-day="明天">明天</button><button data-day="3 天後">3 天後</button><button data-day="7 天後">7 天後</button></div><div class="card consensus"><div class="label" id="when">明天・預報共識</div><div class="big" id="consensusTitle">載入模型預報中…</div><p id="tempConsensus">最高溫預測範圍 --</p><p id="rainConsensus">預估降雨量範圍 --</p></div><div class="card"><div class="label">各來源</div><div id="sources"></div></div><div class="note">v0.9.0・新增動態天氣背景；台北市支援 101 日／夜城市背景。</div></section>
</main><nav class="tabs"><button class="tab active" data-page="now">☀️　現在</button><button class="tab" data-page="compare">⚖️　比較</button></nav>
<script>
const wx=(code,day=1)=>{if(code===0)return[day?"☀️":"🌙","晴朗"];if(code<=2)return[day?"🌤️":"☁️","晴時多雲"];if(code===3)return["☁️","陰天"];if(code<=48)return["🌫️","霧"];if(code<=57)return["🌦️","毛毛雨"];if(code<=67)return["🌧️","雨"];if(code<=77)return["🌨️","雪"];if(code<=82)return["🌦️","陣雨"];if(code<=86)return["🌨️","陣雪"];return["⛈️","雷雨"]};
const wd=["週日","週一","週二","週三","週四","週五","週六"];
function weatherTheme(code,isDay,place=""){const b=document.body;b.classList.remove("wx-day","wx-night","wx-rain","wx-storm","wx-cloud","taipei");const night=!Number(isDay),rain=(code>=51&&code<=82),storm=code>=95,cloud=code>=1&&code<=48;b.classList.add(night?"wx-night":"wx-day");if(storm)b.classList.add("wx-storm");else if(rain)b.classList.add("wx-rain");else if(cloud)b.classList.add("wx-cloud");const tp=/臺北|台北|北投|士林|信義|大安|中正|大同|中山|松山|萬華|文山|內湖|南港/.test([place,currentDistrict,currentPlaceName,document.querySelector("#locationName")?.textContent||""].join(" "));const taipei=tp&&(currentCountryCode==="TW"||currentCountryCode==="");if(taipei)b.classList.add("taipei");let bg;if(storm)bg="linear-gradient(180deg,#182338,#29394e 48%,#101927)";else if(rain)bg=night?"linear-gradient(180deg,#15243a,#23415c 52%,#12273c)":"linear-gradient(180deg,#526f89,#3e6585 48%,#234867)";else if(night)bg=cloud?"radial-gradient(circle at 78% 12%,rgba(232,239,255,.15),transparent 20%),linear-gradient(180deg,#071426,#122d4b 58%,#0b2137)":"radial-gradient(circle at 78% 12%,rgba(255,246,205,.18),transparent 18%),linear-gradient(180deg,#061124,#102a49 58%,#091e34)";else if(cloud)bg="radial-gradient(circle at 78% 9%,rgba(255,255,255,.2),transparent 26%),linear-gradient(180deg,#4d91cb,#3978ad 52%,#275a88)";else bg="radial-gradient(circle at 82% 9%,rgba(255,244,174,.32),transparent 20%),linear-gradient(180deg,#54a7ed,#3789cf 52%,#2468a4)";if(taipei)b.style.removeProperty("--weather-bg");else b.style.setProperty("--weather-bg",bg)}

let currentCoords=null,currentDistrict="",currentCountryCode="TW",currentPlaceName="";
function isTaiwanLocation(){if(currentCountryCode==="TW")return true;const p=currentCoords;if(!p)return false;return p.lat>=21.8&&p.lat<=25.5&&p.lon>=119&&p.lon<=122.3}\nlet savedPlaces=JSON.parse(localStorage.getItem("weatherPlaces")||"[]");
function savePlaces(){localStorage.setItem("weatherPlaces",JSON.stringify(savedPlaces))}
function renderPlaces(){const b=document.querySelector("#placeList");b.innerHTML='<button class="place-item" data-current="1">⌖ 目前位置<small>使用 GPS 定位</small></button>'+savedPlaces.map((p,i)=>'<div class="place-row"><button class="place-item" data-place="'+i+'">📍 '+p.name+'<small>'+p.admin+'</small></button><button class="place-del" data-del="'+i+'" aria-label="刪除 '+p.name+'">×</button></div>').join("");b.querySelector("[data-current]").onclick=()=>{closePlaces();locate()};b.querySelectorAll("[data-del]").forEach(x=>x.onclick=()=>{savedPlaces.splice(+x.dataset.del,1);savePlaces();renderPlaces()});b.querySelectorAll("[data-place]").forEach(x=>x.onclick=()=>{const p=savedPlaces[+x.dataset.place];closePlaces();currentDistrict=p.district||"";currentCountryCode=p.countryCode||"";currentPlaceName=p.name;loadWeather(p.lat,p.lon).then(()=>{document.querySelector("#locationName").textContent="⌖ "+p.name;document.querySelector("#compareLocation").textContent="⌖ "+p.name})})}
function openPlaces(){renderPlaces();document.querySelector("#placeSheet").classList.add("open")}
function closePlaces(){document.querySelector("#placeSheet").classList.remove("open");document.querySelector("#placeInput").value="";renderPlaces()}
async function searchPlace(){const raw=document.querySelector("#placeInput").value.trim();if(!raw)return;const aliases={"東京":"Tokyo","東京都":"Tokyo","大阪":"Osaka","大阪市":"Osaka","京都":"Kyoto","京都市":"Kyoto","首爾":"Seoul","서울":"Seoul","紐約":"New York","纽约":"New York","倫敦":"London","伦敦":"London","巴黎":"Paris","新加坡":"Singapore","香港":"Hong Kong"};const q=aliases[raw]||raw;const r=await fetch("https://geocoding-api.open-meteo.com/v1/search?"+new URLSearchParams({name:q,count:"8",language:"zh",format:"json"}));const j=await r.json(),rs=j.results||[],b=document.querySelector("#placeList");b.innerHTML=rs.length?rs.map((p,i)=>'<button class="place-item" data-result="'+i+'">📍 '+p.name+'<small>'+[p.admin2,p.admin1].filter(Boolean).join("・")+'</small></button>').join(""):'<div class="note">找不到地點，請換個關鍵字</div>';b.querySelectorAll("[data-result]").forEach(x=>x.onclick=()=>{const p=rs[+x.dataset.result],admin=[p.admin2,p.admin1,p.country].filter(Boolean).join("・"),item={name:p.name,admin,lat:p.latitude,lon:p.longitude,countryCode:p.country_code||"",district:(p.country_code==="TW"&&/[區鄉鎮市]$/.test(p.name))?String(p.name).replaceAll("台","臺"):""};if(!savedPlaces.some(z=>z.name===item.name&&z.admin===item.admin)){savedPlaces.push(item);savePlaces()}closePlaces();currentDistrict=item.district;currentCountryCode=item.countryCode||"";currentPlaceName=item.name;loadWeather(item.lat,item.lon).then(()=>{document.querySelector("#locationName").textContent="⌖ "+item.name;document.querySelector("#compareLocation").textContent="⌖ "+item.name})})}

async function resolveDistrict(lat,lon){try{const r=await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=zh`);if(!r.ok)throw Error("geo");const j=await r.json(),a=j.localityInfo?.administrative||[],cc=String(j.countryCode||"").toUpperCase();currentCountryCode=cc;currentPlaceName=String(j.locality||j.city||j.principalSubdivision||"目前位置").replaceAll("台","臺");if(cc==="TW"&&/臺北/.test(String(j.principalSubdivision||"").replaceAll("台","臺")))currentPlaceName+=" 臺北市";if(cc!=="TW")return "";const names=a.map(x=>String(x.name||"").replaceAll("台","臺"));const d=names.find(n=>/[區鄉鎮市]$/.test(n)&&!/[縣市]$/.test(n))||currentPlaceName||"";if(d)localStorage.setItem("weatherDistrict",d);return d}catch(e){return currentCountryCode==="TW"?(localStorage.getItem("weatherDistrict")||""):""}}
async function loadWeather(lat,lon){currentCoords={lat,lon};currentDistrict=await resolveDistrict(lat,lon);const shown=currentCountryCode==="TW"?(currentDistrict||currentPlaceName):(currentPlaceName||"目前位置");if(shown){document.querySelector("#locationName").textContent="⌖ "+shown;document.querySelector("#compareLocation").textContent="⌖ "+shown;}
 const q=new URLSearchParams({latitude:lat,longitude:lon,timezone:"auto",forecast_days:"7",current:"temperature_2m,relative_humidity_2m,apparent_temperature,is_day,weather_code,wind_speed_10m",hourly:"temperature_2m,precipitation_probability,weather_code,is_day",daily:"weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset"});
 const r=await fetch("https://api.open-meteo.com/v1/forecast?"+q);if(!r.ok)throw Error("weather");const d=await r.json();
 const cur=d.current, wi=wx(cur.weather_code,cur.is_day);weatherTheme(Number(cur.weather_code),Number(cur.is_day),currentDistrict||currentPlaceName);
 document.querySelector("#currentTemp").textContent=Math.round(cur.temperature_2m)+"°";document.querySelector("#currentCondition").textContent=wi[0]+" "+wi[1];
 document.querySelector("#todayRange").textContent="最高 "+Math.round(d.daily.temperature_2m_max[0])+"°　最低 "+Math.round(d.daily.temperature_2m_min[0])+"°";
 document.querySelector("#feels").textContent=Math.round(cur.apparent_temperature)+"°";document.querySelector("#humidity").textContent=Math.round(cur.relative_humidity_2m)+"%";document.querySelector("#wind").textContent=Math.round(cur.wind_speed_10m);
 let hi=d.hourly.time.findIndex(t=>t>=cur.time);if(hi<0)hi=0;document.querySelector("#rainChance").textContent=(d.hourly.precipitation_probability[hi]??0)+"%";
 const hs=[];for(let i=hi;i<Math.min(hi+24,d.hourly.time.length);i++){const t=new Date(d.hourly.time[i]);hs.push([i===hi?"現在":String(t.getHours()).padStart(2,"0")+"時",wx(d.hourly.weather_code[i],d.hourly.is_day[i])[0],Math.round(d.hourly.temperature_2m[i])+"°",d.hourly.precipitation_probability[i]??0])}
 document.querySelector("#hours").innerHTML=hs.map(x=>`<div class="hour"><span>${x[0]}</span><div class="ico">${x[1]}</div><small>💧${Number.isFinite(Number(x[3]))?x[3]:0}%</small><b>${x[2]}</b></div>`).join("");
 document.querySelector("#days").innerHTML=d.daily.time.map((s,i)=>{const dt=new Date(s+"T12:00:00"),name=i===0?"今天":wd[dt.getDay()],ic=wx(d.daily.weather_code[i],1)[0];return `<div class="day"><b>${name}</b><span>${ic}</span><span>${Math.round(d.daily.temperature_2m_min[i])}°</span><div><span class="bar" style="display:inline-block;width:60%;margin-right:8px"></span>${Math.round(d.daily.temperature_2m_max[i])}°</div></div>`}).join("");
 try{if(!isTaiwanLocation())throw Error("cwa-outside-tw");const cd=await fetchCWA();if(cd.locationName){document.querySelector("#locationName").textContent="⌖ "+cd.locationName;document.querySelector("#compareLocation").textContent="⌖ "+cd.locationName;}const cx=parseCWAForDay(cd,0);if(cx){if(cx.hi!=null&&cx.lo!=null)document.querySelector("#todayRange").textContent="最高 "+cx.hi+"°　最低 "+cx.lo+"°";if(cx.weather)document.querySelector("#currentCondition").textContent="🇹🇼 "+cx.weather+"　"+Math.round(cur.temperature_2m)+"°";}const seven=cwaDaily7(cd);if(seven.length>=5&&seven.some(z=>z.hi!=null&&z.lo!=null))document.querySelector("#days").innerHTML=seven.map((z,i)=>{const dt=new Date(z.day+"T12:00:00"),name=i===0?"今天":wd[dt.getDay()];return `<div class="day" data-cwa-day="${z.day}"><b>${name}</b><span>${cwaIcon(z.weather)}</span><span>${z.lo??"--"}°</span><div><span class="bar" style="display:inline-block;width:60%;margin-right:8px"></span>${z.hi??"--"}°</div>${cwaDetailHTML(cd,z.day)}</div>`}).join("");document.querySelectorAll("[data-cwa-day]").forEach(el=>el.onclick=()=>el.classList.toggle("open"));}catch(e){}
}
function locate(){currentCountryCode="";currentPlaceName="";currentDistrict="";document.querySelector("#locationName").textContent="⌖ 取得位置中…";if(!navigator.geolocation){fallback();return}navigator.geolocation.getCurrentPosition(p=>{document.querySelector("#locationName").textContent="⌖ 目前位置";document.querySelector("#compareLocation").textContent="⌖ 目前位置";loadWeather(p.coords.latitude,p.coords.longitude).catch(fallback)},fallback,{enableHighAccuracy:true,timeout:10000,maximumAge:300000})}
function fallback(){document.querySelector("#locationName").textContent="⌖ 台北";document.querySelector("#compareLocation").textContent="⌖ 台北";loadWeather(25.05,121.52).catch(()=>document.querySelector("#currentCondition").textContent="天氣資料暫時無法載入")}
document.querySelector("#locateBtn").onclick=locate;document.querySelector("#locationName").onclick=openPlaces;document.querySelector("#placeClose").onclick=closePlaces;document.querySelector("#placeSheet").onclick=e=>{if(e.target.id==="placeSheet")closePlaces()};document.querySelector("#placeAdd").onclick=searchPlace;document.querySelector("#placeInput").addEventListener("keydown",e=>{if(e.key==="Enter")searchPlace()});locate();
let horizon=1;
const providerDefs=[
 {name:"🇹🇼 中央氣象署",endpoint:"cwa",note:"官方鄉鎮預報"},
 {name:"🇩🇪 ICON",endpoint:"dwd-icon",note:"DWD ICON"},
 {name:"🌍 ECMWF",endpoint:"ecmwf",note:"ECMWF IFS"},
 {name:"🇺🇸 GFS",endpoint:"gfs",note:"NOAA GFS"},
 {name:"🇯🇵 JMA",endpoint:"jma",note:"JMA"}
];
async function fetchCWA(){
 if(!currentCoords)throw Error("no-location");
 if(currentCountryCode!=="TW")throw Error("cwa-outside-tw");
 if(!currentDistrict)currentDistrict=await resolveDistrict(currentCoords.lat,currentCoords.lon);
 if(!currentDistrict)throw Error("district-not-found");
 const p=new URLSearchParams({locationName:currentDistrict});
 const r=await fetch("https://aqldnpnemmlljxwxpmfr.supabase.co/functions/v1/weather-api?"+p);
 if(!r.ok)throw Error("cwa");return r.json();
}
function localDateOffset(off){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+off);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function parseCWAForDay(d,dayOffset){return parseCWA(d,localDateOffset(dayOffset==null?1:dayOffset));}
function cwaIcon(s){s=String(s||"");if(/雷/.test(s))return"⛈️";if(/雨/.test(s))return"🌧️";if(/陰/.test(s))return"☁️";if(/多雲|雲/.test(s))return"🌤️";return"☀️"}
function cwaDaily7(d){const out=[];for(let off=0;off<7;off++){const x=parseCWA(d,localDateOffset(off));if(x)out.push({day:x.date,weather:x.weather,hi:x.hi,lo:x.lo})}return out}
function cwaSlots(d,day){const n=d.normalized||{},keys=Object.keys(n),pick=(...names)=>{for(const x of names)if(n[x])return n[x];for(const k of keys)if(names.some(x=>k.includes(x)))return n[k];return []},wv=pick("天氣現象","Wx"),tv=pick("溫度","T"),temps=tv.filter(x=>String(x.start||"").slice(0,10)===day);return wv.filter(x=>String(x.start||"").slice(0,10)===day).map(x=>{const st=String(x.start||""),near=temps.find(t=>String(t.start||"").slice(0,16)===st.slice(0,16)),h=st.slice(11,16);return {time:h,weather:x.value||"",temp:near?parseFloat(String(near.value)):null}}).filter(x=>x.time)}
function cwaDetailHTML(d,day){const a=cwaSlots(d,day);if(!a.length)return '<div class="cwa-hint">中央氣象署此日尚無逐時段資料</div>';return '<div class="cwa-detail">'+a.map(x=>'<div class="cwa-slot"><span>'+x.time+'</span><i>'+cwaIcon(x.weather)+'</i><b>'+(Number.isFinite(x.temp)?Math.round(x.temp)+'°':'--')+'</b></div>').join('')+'</div><div class="cwa-hint">🇹🇼 中央氣象署官方時段預報・點一下收起</div>'}

function parseCWA(d,targetDate){
 const n=d.normalized||{},keys=Object.keys(n),pick=(...names)=>{for(const x of names)if(n[x])return n[x];for(const k of keys)if(names.some(x=>k.includes(x)))return n[k];return []};
 const wx=pick("天氣現象","Wx"),pop=pick("12小時降雨機率","降雨機率","PoP12h","PoP"),temp=pick("溫度","T"),max=pick("最高溫度","最高溫","MaxT"),min=pick("最低溫度","最低溫","MinT"),wind=pick("風速","WS"),day=targetDate||localDateOffset(horizon);
 const noon=new Date(day+"T12:00:00+08:00"),overlaps=x=>{const s=new Date(x.start),e=x.end?new Date(x.end):s;return !Number.isNaN(s)&&!Number.isNaN(e)&&s<=noon&&e>noon},sameDay=x=>String(x.start||"").slice(0,10)===day,items=arr=>arr.filter(overlaps).length?arr.filter(overlaps):arr.filter(sameDay);
 const w=items(wx),wt=w[0];if(!wt)return null;const nums=arr=>items(arr).map(x=>parseFloat(String(x.value))).filter(Number.isFinite);
 let hi=nums(max),lo=nums(min);const ts=nums(temp);if(!hi.length&&ts.length)hi=[Math.max(...ts)];if(!lo.length&&ts.length)lo=[Math.min(...ts)];const po=nums(pop),wi=nums(wind);
 return {date:day,weather:wt.value||"中央氣象署預報",hi:hi.length?Math.max(...hi):null,lo:lo.length?Math.min(...lo):null,pop:po.length?Math.max(...po):null,wind:wi.length?Math.max(...wi):null};
}
async function fetchModel(endpoint,lat,lon){
 const p=new URLSearchParams({latitude:lat,longitude:lon,timezone:"auto",forecast_days:"8",daily:"weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,wind_speed_10m_max",hourly:"weather_code,temperature_2m,precipitation,wind_speed_10m"});
 const r=await fetch("https://api.open-meteo.com/v1/"+endpoint+"?"+p);if(!r.ok)throw Error(endpoint);return r.json();
}
function modelDay(d,target){
 const i=d.daily?.time?.indexOf(target)??-1;
 if(i>=0){const vals=[d.daily.temperature_2m_max?.[i],d.daily.temperature_2m_min?.[i],d.daily.precipitation_sum?.[i],d.daily.wind_speed_10m_max?.[i],d.daily.weather_code?.[i]];if(vals.every(v=>v!=null&&Number.isFinite(Number(v))))return {code:Number(vals[4]),hi:Number(vals[0]),lo:Number(vals[1]),rain:Number(vals[2]),wind:Number(vals[3]),date:target,partial:false};}
 const ids=(d.hourly?.time||[]).map((t,j)=>String(t).slice(0,10)===target?j:-1).filter(j=>j>=0),nums=(a)=>ids.map(j=>a?.[j]).filter(v=>v!=null&&v!=="").map(Number).filter(Number.isFinite);
 const ts=nums(d.hourly?.temperature_2m),rs=nums(d.hourly?.precipitation),ws=nums(d.hourly?.wind_speed_10m),cs=nums(d.hourly?.weather_code);
 if(ts.length<6||ws.length<6||cs.length<6)return null;
 return {code:Math.max(...cs),hi:Math.max(...ts),lo:Math.min(...ts),rain:rs.reduce((a,b)=>a+b,0),wind:Math.max(...ws),date:target,partial:ids.length<24};
}
async function renderCompare(){
 const box=document.querySelector("#sources");if(!currentCoords){box.innerHTML='<div class="source">等待定位…</div>';return}
 box.innerHTML='<div class="source">正在取得五個預報來源…</div>';
 const live=await Promise.all(providerDefs.map(async p=>{if(!p.endpoint)return p;try{if(p.endpoint==="cwa"){if(currentCountryCode!=="TW")return {...p,outsideTW:true};const d=await fetchCWA(),x=parseCWA(d,localDateOffset(horizon));if(!x)return {...p,cwa:true,noForecast:true};return {...p,cwa:true,data:x}}const d=await fetchModel(p.endpoint,currentCoords.lat,currentCoords.lon),target=localDateOffset(horizon),md=modelDay(d,target);if(!md)throw Error("out-of-range");return {...p,data:md}}catch(e){return {...p,error:true}}}));
 box.innerHTML=live.map(p=>{if(!p.endpoint)return `<div class="source"><div><h3>${p.name}</h3><small>${p.note}</small></div><div class="vals"><strong>${p.status}</strong></div></div>`;if(p.outsideTW)return `<div class="source"><div><h3>${p.name}</h3><small>${p.note}</small></div><div class="vals"><strong>僅提供臺灣地區預報</strong></div></div>`;if(p.error)return `<div class="source"><div><h3>${p.name}</h3><small>${p.note}</small></div><div class="vals"><strong>${p.endpoint==="cwa"?"CWA 資料暫時無法取得":"此日期無完整預報"}</strong></div></div>`;if(p.noForecast)return `<div class="source"><div><h3>${p.name}</h3><small>${p.note}</small></div><div class="vals"><strong>官方尚未發布此日期</strong></div></div>`;const x=p.data;if(p.cwa){const temps=(x.hi!=null&&x.lo!=null)?`${x.hi}° / ${x.lo}°`:"溫度資料待補";const rain=x.pop!=null?`降雨機率 ${x.pop}%`:"降雨機率資料待補";return `<div class="source"><div><h3>${p.name}</h3><small>${p.note}・${x.date}</small></div><div class="vals"><strong>${x.weather}　${temps}</strong><div>${rain}・風速 ${x.wind??"--"} m/s</div></div></div>`}const w=wx(x.code,1);return `<div class="source"><div><h3>${p.name}</h3><small>${p.note}・${x.date}</small></div><div class="vals"><strong>${w[0]} ${Math.round(x.hi)}° / ${Math.round(x.lo)}°</strong><div>雨量 ${Number(x.rain).toFixed(1)} mm・最大風速 ${Math.round(x.wind)} km/h</div></div></div>`}).join("");
 const ok=live.filter(p=>p.data&&!p.cwa&&Number.isFinite(p.data.hi)&&Number.isFinite(p.data.lo)&&Number.isFinite(p.data.rain)).map(p=>p.data);if(ok.length){const his=ok.map(x=>x.hi),rs=ok.map(x=>x.rain),wet=ok.filter(x=>x.rain>=1).length;document.querySelector("#consensusTitle").textContent=wet>=2?"🌦️ 多數模型預測有雨":"🌤️ 多數模型偏乾";document.querySelector("#tempConsensus").textContent="最高溫預測範圍 "+Math.round(Math.min(...his))+"–"+Math.round(Math.max(...his))+"°C";document.querySelector("#rainConsensus").textContent="預估雨量範圍 "+Math.min(...rs).toFixed(1)+"–"+Math.max(...rs).toFixed(1)+" mm"}
}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab,.page").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.querySelector("#"+b.dataset.page).classList.add("active");if(b.dataset.page==="compare")renderCompare()});document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".seg button").forEach(x=>x.classList.remove("active"));b.classList.add("active");horizon=b.dataset.day==="明天"?1:b.dataset.day==="3 天後"?3:7;document.querySelector("#when").textContent=b.dataset.day+"・"+localDateOffset(horizon).slice(5).replace("-","/")+"・預報共識";renderCompare()});if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js");
